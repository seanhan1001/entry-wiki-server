<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/entry-tool.css">
    <link rel="stylesheet" href="/entry.min.css">

    <script src="/lib/jquery.min.js"></script>
    <script src="/lib/jquery-ui.min.js"></script>
    <script src="/lib/underscore.min.js"></script>

    <script src="/lib/preloadjs-0.6.0.min.js"></script>
    <script src="/lib/easeljs-0.8.0.min.js"></script>
    <script src="/lib/soundjs-0.6.0.min.js"></script>
    <script src="/lib/flashaudioplugin-0.6.0.min.js"></script>

    <script src="/lib/lodash.min.js"></script>
    <script src="/lib/velocity.min.js"></script>

    <script src="/lib/react.min.js"></script>
    <script src="/lib/react-dom.min.js"></script>

    <script src="/entry-lang-ko.js"></script>
    <script src="/entry-static.js"></script>

    <script src="/entry.min.js"></script>
</head>

<body>
    <div id="entryContainer"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            console.log("createjs:", typeof createjs);
            console.log("_:", typeof _);
            console.log("React:", typeof React);
            console.log("ReactDOM:", typeof ReactDOM);
            console.log("ReactDOM.createRoot:", typeof ReactDOM.createRoot);
            console.log("Entry:", typeof Entry);
            console.log("Entry.init:", typeof Entry.init);
            console.log("Entry.loadProject:", typeof Entry.loadProject);

            Entry.creationChangedEvent = new Entry.Event(window);

            Entry.init(document.getElementById("entryContainer"), {
                type: "workspace",
                libDir: "/lib",
                hardwareEnable: false
            });

            console.log("Entry.init 완료");

            Entry.loadProject();

            console.log("Entry.loadProject 완료");
        });
    </script>
</body>
